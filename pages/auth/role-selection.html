<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Select Role | RaktSetu</title>

    <link rel="stylesheet" href="../../css/style.css">
</head>

<body class="auth-page">

    <div class="auth-container">

        <div class="auth-logo">
            🩸 Rakt<span>Setu</span>
        </div>

        <h1>Choose Your Role</h1>

        <p class="auth-subtitle">
            How would you like to use RaktSetu?
        </p>


        <div class="role-grid">

            <a href="signup.html?role=Donor" class="role-card">
                <div>🩸</div>
                <h3>Donor</h3>
                <p>Donate blood and save lives.</p>
            </a>


            <a href="signup.html?role=Hospital" class="role-card">
                <div>🏥</div>
                <h3>Hospital</h3>
                <p>Manage blood inventory.</p>
            </a>


            <a href="signup.html?role=Volunteer" class="role-card">
                <div>🤝</div>
                <h3>Volunteer</h3>
                <p>Support the community.</p>
            </a>


            <a href="signup.html?role=Recipient" class="role-card">
                <div>❤️</div>
                <h3>Recipient</h3>
                <p>Find blood when needed.</p>
            </a>

        </div>

        <p class="back-link">
            <a href="../../index.html">← Back to Home</a>
        </p>

    </div>

</body>
</html>
